<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>AISAFERIDE Mobile Sender</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; background:#111; color:#eee; }
    button { padding: 12px 18px; font-size: 16px; border-radius: 10px; border: 0; cursor: pointer; }
    #startBtn { background: #22c55e; color: #000; }
    #stopBtn { background: #ef4444; color: #fff; margin-left: 8px; }
    #log { margin-top: 12px; padding: 10px; background: #1f2937; border-radius: 10px; height: 220px; overflow:auto; font-family: monospace; font-size: 13px; }
    video { width: 100%; max-height: 320px; margin-top: 12px; border-radius: 12px; background: #000; }
    .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .pill { padding:6px 10px; border-radius:999px; background:#374151; font-size: 12px; }
  </style>
</head>

<body>
  <h2>AISAFERIDE 📡 Mobile Sender</h2>

  <div class="row">
    <div class="pill">Target WS: <b id="targetWs"></b></div>
    <div class="pill">FPS: <b id="fps">0</b></div>
    <div class="pill">Status: <b id="status">idle</b></div>
  </div>

  <div style="margin-top:12px;">
    <button id="startBtn" onclick="start()">Start Camera</button>
    <button id="stopBtn" onclick="stop()" disabled>Stop</button>
  </div>

  <video id="preview" autoplay playsinline muted></video>

  <div id="log">Waiting for start...</div>

  <script>
    // ✅ CHANGE THIS TO YOUR LAPTOP IP
    const LAPTOP_IP = "192.168.29.85";
    const WS_URL = `ws://${LAPTOP_IP}:9000`;

    document.getElementById("targetWs").innerText = WS_URL;

    const logBox = document.getElementById("log");
    const statusEl = document.getElementById("status");
    const fpsEl = document.getElementById("fps");
    const stopBtn = document.getElementById("stopBtn");

    let ws = null;
    let stream = null;
    let video = null;
    let canvas = null;
    let timer = null;
    let sentFrames = 0;
    let fpsTimer = null;

    function log(msg) {
      const line = `${new Date().toLocaleTimeString()} | ${msg}`;
      logBox.innerHTML += `<div>${line}</div>`;
      logBox.scrollTop = logBox.scrollHeight;
      console.log(line);
    }

    function setStatus(s) {
      statusEl.innerText = s;
    }

    async function start() {
      log("✅ Start clicked");
      setStatus("starting...");

      // Check support
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log("❌ getUserMedia not supported (use Chrome + allow insecure origin flag)");
        setStatus("failed");
        return;
      }

      try {
        // 1) Camera
        log("📷 Requesting camera...");
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        });

        video = document.getElementById("preview");
        video.srcObject = stream;
        await video.play();

        log("✅ Camera started");
        setStatus("camera ok");

        // 2) WebSocket
        log(`🔌 Connecting WS -> ${WS_URL}`);
        ws = new WebSocket(WS_URL);

        ws.onopen = () => {
          log("✅ WebSocket connected");
          setStatus("connected");
          stopBtn.disabled = false;

          // 3) Canvas + send loop
          canvas = document.createElement("canvas");
          canvas.width = 640;
          canvas.height = 480;

          sentFrames = 0;

          // FPS counter
          fpsTimer = setInterval(() => {
            fpsEl.innerText = sentFrames;
            sentFrames = 0;
          }, 1000);

          // Send JPEG frames
          timer = setInterval(() => {
            if (!ws || ws.readyState !== 1 || !video) return;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            const jpeg = canvas.toDataURL("image/jpeg", 0.7);
            ws.send(jpeg);

            sentFrames++;
          }, 100); // 10 FPS
        };

        ws.onerror = () => {
          log("❌ WebSocket error (check IP / firewall / server running)");
          setStatus("ws error");
        };

        ws.onclose = () => {
          log("⚠️ WebSocket closed");
          setStatus("disconnected");
        };

      } catch (err) {
        log("❌ ERROR: " + err.message);
        log("Hint: Chrome flag required for camera over http://IP");
        setStatus("failed");
      }
    }

    function stop() {
      log("🛑 Stop clicked");
      setStatus("stopping...");

      // stop timers
      if (timer) clearInterval(timer);
      timer = null;

      if (fpsTimer) clearInterval(fpsTimer);
      fpsTimer = null;
      fpsEl.innerText = "0";

      // close ws
      if (ws) {
        try { ws.close(); } catch(e) {}
        ws = null;
      }

      // stop camera
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }

      stopBtn.disabled = true;
      setStatus("idle");
      log("✅ Stopped");
    }
  </script>
</body>
</html>
